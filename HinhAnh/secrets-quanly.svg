<svg xmlns="http://www.w3.org/2000/svg" width="910" height="560" viewBox="0 0 910 560" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#1a7f37"/>
</marker>
<marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#cf222e"/>
</marker>
</defs>
<rect x="0" y="0" width="910" height="560" fill="#f6f8fa"/>
<text x="455" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2328">Quản lý secret cho project ASPX .NET Framework 4.8.1</text>
<text x="455" y="64" text-anchor="middle" font-size="14" fill="#1f2328">So sánh cách làm sai và cách làm đúng khi lưu connection string</text>
<rect x="30" y="90" width="410" height="440" fill="#ffffff" stroke="#cf222e" stroke-width="3"/>
<rect x="30" y="90" width="410" height="52" fill="#cf222e"/>
<circle cx="70" cy="116" r="15" fill="#ffffff"/>
<path d="M62,108 L78,124 M78,108 L62,124" stroke="#cf222e" stroke-width="4" stroke-linecap="round"/>
<text x="95" y="122" font-size="18" font-weight="bold" fill="#ffffff">SAI: lộ secret lên Git</text>
<rect x="55" y="165" width="360" height="64" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/>
<text x="72" y="190" font-size="15" font-weight="bold" fill="#1f2328">1. Web.config chứa connection string thật</text>
<text x="72" y="212" font-size="13" fill="#1f2328">password="sa123456" ghi trực tiếp trong file</text>
<rect x="55" y="245" width="360" height="64" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/>
<text x="72" y="270" font-size="15" font-weight="bold" fill="#1f2328">2. commit rồi push lên public repo</text>
<text x="72" y="292" font-size="13" fill="#1f2328">git push origin main lên GitHub công khai</text>
<rect x="55" y="325" width="360" height="64" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/>
<text x="72" y="350" font-size="15" font-weight="bold" fill="#1f2328">3. Secret lộ vĩnh viễn trong lịch sử Git</text>
<text x="72" y="372" font-size="13" fill="#1f2328">Xóa file vẫn còn trong commit cũ</text>
<line x1="235" y1="229" x2="235" y2="245" stroke="#cf222e" stroke-width="3" marker-end="url(#arrR)"/>
<line x1="235" y1="309" x2="235" y2="325" stroke="#cf222e" stroke-width="3" marker-end="url(#arrR)"/>
<rect x="55" y="410" width="360" height="90" fill="#cf222e" stroke="#cf222e" stroke-width="2"/>
<text x="235" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Hậu quả: mất tài khoản CSDL,</text>
<text x="235" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">bị quét secret tự động,</text>
<text x="235" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">phải đổi mật khẩu ngay</text>
<rect x="470" y="90" width="410" height="440" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/>
<rect x="470" y="90" width="410" height="52" fill="#1a7f37"/>
<circle cx="510" cy="116" r="15" fill="#ffffff"/>
<path d="M502,116 L508,122 L519,109" stroke="#1a7f37" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="535" y="122" font-size="18" font-weight="bold" fill="#ffffff">ĐÚNG: secret trong pipeline</text>
<rect x="495" y="158" width="360" height="56" fill="#f6f8fa" stroke="#1f6feb" stroke-width="2"/>
<text x="512" y="180" font-size="15" font-weight="bold" fill="#1f2328">1. Web.config mẫu giá trị giả</text>
<text x="512" y="201" font-size="13" fill="#1f2328">password="__DB_PASSWORD__" commit được</text>
<rect x="495" y="224" width="360" height="56" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
<text x="512" y="246" font-size="15" font-weight="bold" fill="#1f2328">2. Web.Release.config transform</text>
<text x="512" y="267" font-size="13" fill="#1f2328">Thay connection string lúc publish Release</text>
<rect x="495" y="290" width="360" height="56" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
<text x="512" y="312" font-size="15" font-weight="bold" fill="#1f2328">3. GitHub Secrets, GitLab Variables</text>
<text x="512" y="333" font-size="13" fill="#1f2328">Lưu mật khẩu thật ngoài source code</text>
<rect x="495" y="356" width="360" height="56" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
<text x="512" y="378" font-size="15" font-weight="bold" fill="#1f2328">4. Pipeline bơm secret lúc deploy</text>
<text x="512" y="399" font-size="13" fill="#1f2328">Actions và GitLab CI truyền biến vào build</text>
<line x1="675" y1="214" x2="675" y2="224" stroke="#1a7f37" stroke-width="3" marker-end="url(#arrG)"/>
<line x1="675" y1="280" x2="675" y2="290" stroke="#1a7f37" stroke-width="3" marker-end="url(#arrG)"/>
<line x1="675" y1="346" x2="675" y2="356" stroke="#1a7f37" stroke-width="3" marker-end="url(#arrG)"/>
<line x1="675" y1="412" x2="675" y2="428" stroke="#1a7f37" stroke-width="3" marker-end="url(#arrG)"/>
<rect x="495" y="428" width="360" height="72" fill="#1a7f37" stroke="#1a7f37" stroke-width="2"/>
<text x="675" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">5. Deploy an toàn lên server</text>
<text x="675" y="477" text-anchor="middle" font-size="13" fill="#ffffff">Repo công khai nhưng secret vẫn kín</text>
<text x="455" y="552" text-anchor="middle" font-size="12" fill="#1f2328">Luồng deploy cột phải: mẫu giả trong Git, secret thật chỉ tồn tại trong pipeline lúc publish.</text>
</svg>
