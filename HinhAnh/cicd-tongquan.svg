<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="Segoe UI, Arial, sans-serif">
<rect width="920" height="300" rx="14" fill="#f6f8fa"/>
<text x="460" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">Pipeline CI/CD tổng quan cho đồ án ASPX 4.8.1</text>
<defs><marker id="c" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1f2328"/></marker></defs>
<rect x="20" y="80" width="130" height="100" rx="10" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
<text x="85" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6feb">Commit</text>
<text x="85" y="130" text-anchor="middle" font-size="12" fill="#1f2328">push / PR / MR</text>
<text x="85" y="148" text-anchor="middle" font-size="12" fill="#1f2328">kích hoạt pipeline</text>
<rect x="180" y="80" width="150" height="100" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
<text x="255" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#8250df">Build</text>
<text x="255" y="130" text-anchor="middle" font-size="12" fill="#1f2328">NuGet restore</text>
<text x="255" y="148" text-anchor="middle" font-size="12" fill="#1f2328">msbuild (.sln)</text>
<rect x="360" y="80" width="150" height="100" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
<text x="435" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6700">Test</text>
<text x="435" y="130" text-anchor="middle" font-size="12" fill="#1f2328">VSTest / NUnit</text>
<text x="435" y="148" text-anchor="middle" font-size="12" fill="#1f2328">publish kết quả</text>
<rect x="540" y="80" width="150" height="100" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="615" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#cf222e">Deploy</text>
<text x="615" y="130" text-anchor="middle" font-size="12" fill="#1f2328">publish → IIS</text>
<text x="615" y="148" text-anchor="middle" font-size="12" fill="#1f2328">staging / prod</text>
<rect x="720" y="80" width="130" height="100" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="785" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">Monitor</text>
<text x="785" y="130" text-anchor="middle" font-size="12" fill="#1f2328">log + alert</text>
<text x="785" y="148" text-anchor="middle" font-size="12" fill="#1f2328">rollback</text>
<line x1="152" y1="130" x2="176" y2="130" stroke="#1f2328" stroke-width="2" marker-end="url(#c)"/>
<line x1="332" y1="130" x2="356" y2="130" stroke="#1f2328" stroke-width="2" marker-end="url(#c)"/>
<line x1="512" y1="130" x2="536" y2="130" stroke="#1f2328" stroke-width="2" marker-end="url(#c)"/>
<line x1="692" y1="130" x2="716" y2="130" stroke="#1f2328" stroke-width="2" marker-end="url(#c)"/>
<rect x="30" y="210" width="860" height="68" rx="8" fill="#fff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="460" y="235" text-anchor="middle" font-size="13" fill="#1f2328">CI (tích hợp liên tục): mỗi push/PR đều build + test tự động → phát hiện lỗi sớm.</text>
<text x="460" y="257" text-anchor="middle" font-size="13" fill="#1f2328">CD (phân phối liên tục): gói publish tự động đưa lên IIS → deploy nhanh, rollback dễ.</text>
</svg>
