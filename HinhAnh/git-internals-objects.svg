<text x="60" y="466" text-anchor="start" font-size="13" fill="#1f2328">Chú thích: mỗi commit chứa message + author + hash của tree.</text>
<text x="60" y="490" text-anchor="start" font-size="13" fill="#1f2328">Mũi tên đỏ trỏ ngược: commit con trỏ tới commit cha (C3 → C2 → C1).</text>
<text x="60" y="514" text-anchor="start" font-size="13" fill="#1f2328">Tree liệt kê tên file và hash blob; blob lưu nội dung file theo hash.</text>
<text x="60" y="538" text-anchor="start" font-size="13" fill="#1f2328">Blob trùng hash được tái sử dụng giữa các commit (tiết kiệm dung lượng).</text>
