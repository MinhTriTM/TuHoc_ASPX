<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="910" height="440" viewBox="0 0 910 440" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="mBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/>
</marker>
<marker id="mDark" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#1f2328"/>
</marker>
<marker id="mPurple" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#8250df"/>
</marker>
</defs>
<rect x="0" y="0" width="910" height="440" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/>
<text x="455" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2328">Vòng đời trạng thái file trong Git</text>
<text x="455" y="58" text-anchor="middle" font-size="13" fill="#1f2328">Ví dụ với project ASP.NET Web Forms (.NET Framework 4.8.1)</text>
<rect x="30" y="85" width="180" height="145" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="2.5"/>
<text x="120" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#cf222e">1. Untracked</text>
<text x="120" y="133" text-anchor="middle" font-size="13" fill="#1f2328">Chưa được theo dõi</text>
<text x="120" y="154" text-anchor="middle" font-size="12" fill="#1f2328">Ví dụ: file Default.aspx</text>
<text x="120" y="172" text-anchor="middle" font-size="12" fill="#1f2328">mới tạo trong VS</text>
<text x="120" y="193" text-anchor="middle" font-size="12" fill="#1f2328">Lệnh xem: git status</text>
<text x="120" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#cf222e">Chữ đỏ: chưa add</text>
<rect x="250" y="85" width="180" height="145" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="2.5"/>
<text x="340" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a6700">2. Modified</text>
<text x="340" y="133" text-anchor="middle" font-size="13" fill="#1f2328">Đã sửa đổi nội dung</text>
<text x="340" y="154" text-anchor="middle" font-size="12" fill="#1f2328">Ví dụ: vừa sửa file</text>
<text x="340" y="172" text-anchor="middle" font-size="12" fill="#1f2328">Default.aspx.cs trong VS</text>
<text x="340" y="193" text-anchor="middle" font-size="12" fill="#1f2328">Lệnh xem: git diff</text>
<text x="340" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6700">Chữ đỏ: chưa add</text>
<rect x="470" y="85" width="180" height="145" rx="10" fill="#ffffff" stroke="#1f6feb" stroke-width="2.5"/>
<text x="560" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6feb">3. Staged</text>
<text x="560" y="133" text-anchor="middle" font-size="13" fill="#1f2328">Đã lên khu vực chờ</text>
<text x="560" y="154" text-anchor="middle" font-size="12" fill="#1f2328">Ví dụ: đã chạy git add</text>
<text x="560" y="172" text-anchor="middle" font-size="12" fill="#1f2328">cho file Default.aspx</text>
<text x="560" y="193" text-anchor="middle" font-size="12" fill="#1f2328">Xem: git diff --staged</text>
<text x="560" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">Chữ xanh: chờ commit</text>
<rect x="690" y="85" width="180" height="145" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5"/>
<text x="780" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a7f37">4. Committed</text>
<text x="780" y="133" text-anchor="middle" font-size="13" fill="#1f2328">Đã lưu vào kho Git</text>
<text x="780" y="154" text-anchor="middle" font-size="12" fill="#1f2328">Ví dụ: đã git commit</text>
<text x="780" y="172" text-anchor="middle" font-size="12" fill="#1f2328">lưu trang Default.aspx</text>
<text x="780" y="193" text-anchor="middle" font-size="12" fill="#1f2328">Lệnh xem: git log</text>
<text x="780" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f37">Sạch: hết việc để commit</text>
<line x1="212" y1="150" x2="248" y2="150" stroke="#1f2328" stroke-width="2" marker-end="url(#mDark)"/>
<text x="230" y="138" text-anchor="middle" font-size="11" fill="#1f2328">sửa file</text>
<line x1="432" y1="150" x2="468" y2="150" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#mBlue)"/>
<text x="450" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f6feb">git add</text>
<line x1="652" y1="150" x2="688" y2="150" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#mBlue)"/>
<text x="670" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f6feb">git commit</text>
<path d="M780,230 L780,268 L340,268 L340,232" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#mDark)"/>
<text x="560" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#cf222e">modify: sửa tiếp file đã commit</text>
<rect x="250" y="300" width="180" height="95" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2.5" stroke-dasharray="8,4"/>
<text x="340" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#8250df">Nhánh phụ: Stash</text>
<text x="340" y="346" text-anchor="middle" font-size="12" fill="#1f2328">Cất tạm phần đang sửa dở</text>
<text x="340" y="365" text-anchor="middle" font-size="12" fill="#1f2328">git stash / git stash pop</text>
<text x="340" y="384" text-anchor="middle" font-size="11" fill="#1f2328">Dùng khi cần đổi nhánh gấp</text>
<line x1="308" y1="268" x2="308" y2="298" stroke="#8250df" stroke-width="2" marker-end="url(#mPurple)"/>
<text x="298" y="290" text-anchor="end" font-size="11" fill="#8250df">stash</text>
<line x1="370" y1="298" x2="370" y2="270" stroke="#8250df" stroke-width="2" marker-end="url(#mPurple)"/>
<text x="380" y="290" text-anchor="start" font-size="11" fill="#8250df">pop</text>
<text x="455" y="421" text-anchor="middle" font-size="12" fill="#1f2328">Luồng xuôi: sửa rồi add rồi commit. Luồng ngược: commit rồi vẫn sửa tiếp được.</text>
</svg>
